[build-system]
requires = ["maturin>=1.14.0,<1.15"]
build-backend = "maturin"

[project]
name = "compostr"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.14.1,<1.15",
]
