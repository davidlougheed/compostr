[project]
name = "compostr_benchmarking"
version = "0.0.0"
description = "Benchmarking for the Compostr library"
readme = "README.md"
authors = [
    { name = "David Lougheed", email = "david.lougheed@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "trviz>=1.4.2",
]

[project.scripts]
benchmarking = "compostr_benchmarking.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
