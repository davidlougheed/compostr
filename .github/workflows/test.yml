name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - name: Run tests
        run: cargo test

  python-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          rustflags: ""

      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python dependencies
        run: uv sync

      - name: Run Python tests
        working-directory: ./compostr_py
        run: uv run pytest
